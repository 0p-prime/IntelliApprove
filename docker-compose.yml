version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: intelliapprove-db
    environment:
      POSTGRES_USER: aicte_user
      POSTGRES_PASSWORD: aicte_password_2026
      POSTGRES_DB: intelliapprove
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicte_user -d intelliapprove"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: intelliapprove-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://aicte_user:aicte_password_2026@postgres:5432/intelliapprove
      - SECRET_KEY=aicte_sih_2026_super_secret_jwt_key_98374283749234
      - ENABLE_SCHEDULER=true
      - SLA_CHECK_INTERVAL_SECONDS=30
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: intelliapprove-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
