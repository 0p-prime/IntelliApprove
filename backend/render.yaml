services:
  - type: web
    name: intelliapprove-backend
    env: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m app.seed
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: intelliapprove-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: SLA_CHECK_INTERVAL_SECONDS
        value: "60"
      - key: ALERT_EVAL_INTERVAL_SECONDS
        value: "60"

databases:
  - name: intelliapprove-db
    region: oregon
    plan: free
    databaseName: intelliapprove
    user: intelliapprove_user

